plugins {
    id 'com.android.application'
}

android {
    namespace 'org.classickeyboard.legacy'
    compileSdk 36

    defaultConfig {
        applicationId 'org.classickeyboard.legacy'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }
}
