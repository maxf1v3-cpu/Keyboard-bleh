
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Classic Keyboard
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Accept Android SDK licenses and install API 36
        shell: bash
        run: |
          set -eu
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            if [[ -n "${ANDROID_HOME:-}" && -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]]; then
              SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            else
              echo "Android SDK command-line tools (sdkmanager) were not found on this runner."
              exit 1
            fi
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify source package
        run: python3 verify_project.py

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: classic-keyboard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
